services:
  redis:
    image: redis:7-alpine
    container_name: upscale_redis
    restart: unless-stopped

  web:
    build: .
    container_name: upscale_web
    restart: unless-stopped
    command: gunicorn app:app --bind 0.0.0.0:5000 --workers 2
    ports:
      - "5000:5000"
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

  worker:
    build: .
    container_name: upscale_worker
    restart: unless-stopped
    command: celery -A tasks worker --loglevel=info
    environment:
      REDIS_URL: redis://redis:6379/0
      MODEL_PATH: /app/EDSR_x2.pb
    depends_on:
      - redis